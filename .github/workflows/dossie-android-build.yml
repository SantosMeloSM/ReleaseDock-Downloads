name: Dossie Android 1.1 build
on:
  push:
    branches:
      - dossie-android-v11-build
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extrair fontes do app
        run: |
          base64 -d dossie-android-source.b64 > /tmp/dossie-src.zip
          unzip -oq /tmp/dossie-src.zip -d .
          test -f app/src/main/java/br/com/santosmelo/dossie/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Preparar Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar aplicativo
        run: gradle --no-daemon assembleDebug
      - name: Validar APK Android
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dossie-v1-1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
